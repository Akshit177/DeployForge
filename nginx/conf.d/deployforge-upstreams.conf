upstream upstream_phasec_service_3000 {
    server 127.0.0.1:3000 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name phasec-service-1791971887611.deployforge.app;

    location / {
        proxy_pass http://upstream_phasec_service_3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
