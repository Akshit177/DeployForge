<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DeployForge - Sign In</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="auth-wrapper">
    <div class="auth-card">
      <!-- Logo -->
      <div class="logo-container">
        <svg class="brand-logo" width="58" height="58" viewBox="0 0 118 118" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M72.9902 41.3169C74.9673 40.8811 76.7294 42.6432 76.2936 44.6203L68.3353 80.7274C67.8641 82.8655 65.2166 83.6389 63.6685 82.0908L35.5197 53.942C33.9716 52.3939 34.745 49.7464 36.8831 49.2752L72.9902 41.3169Z" fill="white"/>
          <ellipse cx="49.7257" cy="68.1479" rx="11.1584" ry="13.0265" transform="rotate(45 49.7257 68.1479)" fill="white"/>
          <ellipse cx="49.7256" cy="68.1479" rx="5.5792" ry="6.51326" transform="rotate(45 49.7256 68.1479)" fill="black"/>
        </svg>
      </div>

      <header class="auth-header">
        <h1>Welcome to DeployForge</h1>
        <p>Sign in to manage and deploy your projects</p>
      </header>

      <form class="auth-form" id="loginForm">
        <!-- Email Input -->
        <div class="input-group">
          <label for="email">Email</label>
          <div class="input-wrapper">
            <input 
              type="email" 
              id="email" 
              placeholder="you@domain.com" 
              required 
              autocomplete="email" 
            />
          </div>
        </div>

        <!-- Password Input -->
        <div class="input-group">
          <div class="label-row">
            <label for="password">Password</label>
            <a href="#" class="forgot-link">Forgot password?</a>
          </div>
          <div class="input-wrapper">
            <input 
              type="password" 
              id="password" 
              placeholder="••••••••" 
              required 
              autocomplete="current-password" 
            />
            <button 
              type="button" 
              class="eye-toggle" 
              id="togglePassword" 
              aria-label="Toggle password visibility"
            >
              <svg width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M1.7181 10.2908C1.64865 10.1037 1.64865 9.89792 1.7181 9.71082C2.39452 8.0707 3.5427 6.66835 5.01708 5.68157C6.49146 4.69478 8.22564 4.168 9.99977 4.168C11.7739 4.168 13.5081 4.69478 14.9825 5.68157C16.4568 6.66835 17.605 8.0707 18.2814 9.71082C18.3509 9.89792 18.3509 10.1037 18.2814 10.2908C17.605 11.9309 16.4568 13.3333 14.9825 14.3201C13.5081 15.3069 11.7739 15.8336 9.99977 15.8336C8.22564 15.8336 6.49146 15.3069 5.01708 14.3201C3.5427 13.3333 2.39452 11.9309 1.7181 10.2908ZM12.5002 10.0005C12.5002 11.3812 11.3809 12.5005 10.0002 12.5005C8.61945 12.5005 7.50016 11.3812 7.50016 10.0005C7.50016 8.61981 8.61945 7.50052 10.0002 7.50052C11.3809 7.50052 12.5002 8.61981 12.5002 10.0005Z" stroke-width="2" stroke-linecap="round" stroke="white" stroke-opacity="0.501961"/>
              </svg>
            </button>
          </div>
        </div>

        <button type="submit" class="submit-btn">Sign In</button>
      </form>
      <p class="form-message" id="formMessage" role="status" aria-live="polite"></p>

      <div class="auth-footer">
        <p>Don't have an account? <a href="register.html">Create account</a></p>
      </div>
    </div>
  </div>

  <script src="auth.js" defer></script>
</body>
</html>
