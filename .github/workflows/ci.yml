name: CI

on:
  push:
    branches: [main, "phase-*"]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    name: Build & Test Platform
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci_test_db_password_12345
          POSTGRES_DB: deployforge
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install C++ Worker Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libhiredis-dev nlohmann-json3-dev build-essential

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Build Frontend
        working-directory: frontend
        run: npm run build

      - name: Install Backend Dependencies
        working-directory: backend
        run: npm ci

      - name: Run Database Migrations
        working-directory: backend
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USER: postgres
          DB_PASSWORD: ci_test_db_password_12345
          DB_NAME: deployforge
        run: npm run migrate

      - name: Run Backend Test Suite
        working-directory: backend
        env:
          NODE_ENV: test
          PORT: 3000
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USER: postgres
          DB_PASSWORD: ci_test_db_password_12345
          DB_NAME: deployforge
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          JWT_SECRET: ci_test_jwt_secret_token_minimum_32_chars_ok
          ENCRYPTION_KEY: ci_test_encryption_key_minimum_32_chars_diff
          NGINX_UPSTREAMS_PATH: /tmp/deployforge-upstreams-ci.conf
          DOCKER_MODE: simulator
        run: npm test

      - name: Run C++ Worker Test Suite
        run: make -C worker test

      - name: Build Docker Compose Images
        env:
          JWT_SECRET: ci_test_jwt_secret_token_minimum_32_chars_ok
          ENCRYPTION_KEY: ci_test_encryption_key_minimum_32_chars_diff
          DB_PASSWORD: ci_test_db_password_12345
          INTERNAL_TOKEN: ci_test_internal_token_minimum_16_chars
        run: docker compose build

      - name: Verify Clean Git State
        run: |
          STATUS=$(git status --porcelain)
          if [ -n "$STATUS" ]; then
            echo "Error: Working directory dirty after tests and build:"
            echo "$STATUS"
            exit 1
          fi
